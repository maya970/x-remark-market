name: 自动发货

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

concurrency:
  group: grant-service
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 检查新订单并自动发货
        env:
          ESCROW_WALLET: ${{ secrets.ESCROW_WALLET }}
        run: |
          if [ -z "$ESCROW_WALLET" ]; then
            echo "::error::缺少仓库密钥 ESCROW_WALLET，请在 Settings → Secrets and variables → Actions 中添加发货钱包"
            exit 1
          fi
          node server/grant-service.mjs run 4

      - name: 保持定时任务不被 GitHub 自动停用
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
